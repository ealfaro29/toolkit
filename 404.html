<!DOCTYPE html>
<html lang="en" data-static-shell="true" data-is-dead="true">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VGTools</title>
  <link rel="stylesheet" href="/shared/styles.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #030303 !important;
      background-color: #030303 !important;
      color: rgba(255, 255, 255, 0.78);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .vgtools-dead-message-inner {
      max-width: min(520px, 90vw);
      text-align: center;
      color: rgba(255, 255, 255, 0.78);
      text-shadow: 0 18px 48px rgba(0, 0, 0, 0.75);
    }
    .vgtools-dead-message-main {
      margin: 0;
      font-size: clamp(20px, 3.1vw, 42px);
      line-height: 1.08;
      font-weight: 500;
    }
    .vgtools-dead-message-signature {
      margin-top: 18px;
      font-size: clamp(16px, 1.7vw, 24px);
      color: rgba(255, 255, 255, 0.48);
    }
  </style>
  <script src="/shared/static-shell.js"></script>
</head>
<body>
  <div class="vgtools-dead-message" aria-live="polite">
    <div class="vgtools-dead-message-inner">
      <p class="vgtools-dead-message-main">VGTools is officially dead, sorry guys</p>
      <div class="vgtools-dead-message-signature">E</div>
    </div>
  </div>
</body>
</html>
